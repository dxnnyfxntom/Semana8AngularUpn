<header class="encabezado">
  <!-- Flexbox de Bootstrap: extremos opuestos y centrado vertical -->
  <div class="container d-flex justify-content-between align-items-center">
    <div>
      <p class="encabezado__kicker mb-0">Módulo de productos</p>
      <!-- Interpolación: muestra el valor del input titulo -->
      <h1 class="h4 mb-0">{{ titulo() }}</h1>
    </div>
    <span class="badge rounded-pill text-bg-light fs-6">
      {{ totalProductos() }} productos
    </span>
  </div>
</header>
